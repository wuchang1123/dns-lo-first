# DNS 服务器配置
# 目标部署环境：OpenWrt x86_64。
# OpenWrt 服务启动目录不固定，生产环境优先使用绝对路径。

base_dir: "/etc/dns-lo-first"

server:
  # 默认使用 5355，避免和 OpenWrt 自带 dnsmasq 的 53 端口冲突。
  listen: ":5355"

  # 正常响应写入基础缓存时使用的默认 TTL（秒）。
  domain_ttl: 60

  # 默认并发查询的总等待窗口（秒）。
  concurrent_timeout: 6

  # 单个上游请求超时（秒）。
  upstream_timeout: 3

  # 单个上游超时后的冻结时间（秒）。
  upstream_freeze_duration: 60

  # 日志目录路径。
  log_path: "/var/log/dns-lo-first"

  # 缓存目录路径。不要放在 /tmp，OpenWrt 上 /tmp 通常是内存文件系统。
  cache_path: "/var/cache/dns-lo-first"

  # 日志时区。
  log_timezone: "Asia/Shanghai"

  # 日志等级：debug, info, warn, error, fatal。
  log_level: "info"

cache:
  # 基础响应缓存。
  response:
    enabled: true
    memory_size: 10000
    stale_ttl: 3
    cleanup_after_hours: 48

  # 校对结论缓存。
  comparison:
    enabled: true
    ttl_hours: 168

  # ASN 检查失败但仍需要返回时使用的短 TTL。
  suspect_ttl: 30

# 下载规则、解析 DoH 域名时使用的递归 DNS。
# 只支持 Do53，格式为 host:port；不要配置 DoH，避免启动阶段形成解析循环。
bootstrap_dns:
  - "223.5.5.5:53"
  - "119.29.29.29:53"
  - "8.8.8.8:53"
  - "1.1.1.1:53"

upstream:
  # Do53 使用 host:port；DoH 使用 HTTPS URL。
  # 同一类里可以混合 Do53 和 DoH，按配置顺序选择，超时后尝试剩余上游。
  servers:
    local:
      - "223.5.5.5:53"                    # 阿里云 DNS Do53
      - "119.29.29.29:53"                 # DNSPod Do53
      - "https://dns.alidns.com/dns-query" # 阿里云 DNS DoH
      - "https://doh.pub/dns-query"        # DNSPod DoH

    overseas:
      - "8.8.8.8:53"                               # Google DNS Do53
      - "1.1.1.1:53"                               # Cloudflare DNS Do53
      - "https://dns.google/dns-query"             # Google DNS DoH
      - "https://cloudflare-dns.com/dns-query"     # Cloudflare DNS DoH
      - "https://dns.quad9.net/dns-query"          # Quad9 DoH

  # 上游评分。Do53 和 DoH 合并统计，只按具体上游地址区分。
  scoring:
    enabled: true
    initial_score: 100
    latency_window: 20
    success_weight: 10
    failure_penalty: 25
    timeout_penalty: 50
    consecutive_failure_penalty: 15
    latency_penalty_per_100ms: 2
    min_score: 0
    max_score: 1000
    low_score_probe_interval: "1h"
    same_score_random: true

  # 分流优先级：overseas_only > local_only > local_domains > 默认并发。
  local_only:
    - "ntp.org"

  overseas_only:
    - "googlevideo.com"
    - "ytimg.com"
    - "ggpht.com"

  # EDNS Client Subnet 固定配置；关闭时不向上游发送 ECS。
  # 示例：ipv4: "0.0.0.0/0" 表示匿名 ECS；也可填固定网段如 "1.2.3.0/24"。
  edns_client_subnet:
    enabled: false
    ipv4: "0.0.0.0/0"
    ipv6: ""

# 所在国域名列表。命中的域名只使用本地 DNS 上游服务器。
local_domains:
  source_url: "https://raw.githubusercontent.com/wuchang1123/cn-dns-conf/refs/heads/main/out/dnsmasq-china.conf"
  file_path: "/etc/dns-lo-first/data/china_domains.txt"
  update_interval_hours: 24

asn:
  enabled: true
  file_path: "/etc/dns-lo-first/data/domain_asn.yaml"

comparison:
  # 默认校对比较使用 IP 交集和 ASN/组织一致。
  # /24 和 /16 作为弱一致信号，用于兼容 CDN 调度差异。
  allow_same_24_as_weak_match: true
  allow_same_16_match: true
