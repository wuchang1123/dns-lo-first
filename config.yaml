# DNS 服务本身的运行参数
server:
  # 监听地址。OpenWrt 上通常使用 ":53"；本地测试可改为 ":1053" 避免 root 权限。
  listen: ":53"
  # 单次客户端查询的总超时时间。超过后按查询流程返回 SERVFAIL 或已有本地兜底结果。
  total_timeout: 6s
  # 日志时间使用的时区。
  timezone: "Asia/Shanghai"

# Bootstrap DNS 用于下载配置、解析本地类 DoH hostname 等启动期/外部 HTTP 场景。
# 仅支持 Do53 host:port；为空时会从配置中的 Do53 上游过滤回环后选取，再为空则使用内置默认值。
bootstrap_dns:
  - "223.5.5.5:53"
  - "8.8.8.8:53"
  - "1.1.1.1:53"

# 专用于「海外类 DoH」URL 中 hostname 的 Do53 解析（过滤回环）。
# 为空或未配置时，程序会回退使用上面的 bootstrap_dns；若仍为空则使用 8.8.8.8 / 1.1.1.1。
doh_bootstrap_dns:
  - "8.8.8.8:53"
  - "1.1.1.1:53"

# ASN 污染检查（domain_asn.yaml）
asn:
  # 是否启用 ASN 污染检查与信誉更新。
  enabled: false
  # ASN 配置文件路径（suffix -> org -> prefixes）。
  file_path: "./data/domain_asn.yaml"

# 上游信誉缓存（按上游地址存信誉分，持久化 JSON）
reputation:
  # 是否启用信誉缓存（被 ASN 污染检查驱动更新）。
  enabled: false
  # 持久化文件路径（JSON）。
  file_path: "./cache/reputation.json"
  # 每次校验增减的步长（默认 1）。
  delta: 1
  # 信誉分钳制范围（默认 [-100,100]）。
  min: -100
  max: 100

# 上游 DNS 配置。支持 Do53 host:port 和 DoH URL。
upstream:
  # 单个上游请求超时时间。首选上游超时后会并发尝试同类剩余上游。
  timeout: 3s
  # 单个上游超时后的冻结时间；同类型全部冻结时会先解冻最早被冻结的上游。
  freeze_duration: 1m
  # 低分上游探测间隔。每隔该时间允许分值最低且未冻结的上游优先尝试一次。
  low_score_probe_interval: 1h

  # EDNS Client Subnet 固定注入配置。
  ecs:
    # 是否启用 ECS 注入。
    enabled: false
    # 固定注入的 IPv4 地址；为空时即使 enabled=true 也不会注入。
    ipv4: ""
    # ECS source prefix length，常用 24。
    source_prefix: 24
    # ECS scope prefix length，通常保持 0。
    scope_prefix: 0

  # 上游评分参数。Do53 和 DoH 不区分协议，按地址合并记账。
  scoring:
    # 新上游初始分。
    initial_score: 100
    # 分数下限。
    min_score: 0
    # 分数上限。
    max_score: 200
    # 成功响应的加分。
    success_reward: 3
    # 普通失败扣分。
    failure_penalty: 12
    # 超时扣分，并触发冻结。
    timeout_penalty: 18
    # 每 100ms 延迟扣分。
    latency_penalty_per_100ms: 1
    # 海外上游延迟通常更高，此系数用于缩小海外延迟扣分。
    overseas_latency_discount: 0.6

  # 本地类上游。local_only 和 local_domains 命中的域名只使用本地类。
  # 本地类 DoH URL 的 hostname 解析使用 Bootstrap DNS 流程。
  local:
    - "192.168.100.1:53"
    - "223.5.5.5:53"
    - "119.29.29.29:53"
    - "https://dns.alidns.com/dns-query"

  # 海外类上游。默认路径优先使用海外类；海外 DoH hostname 使用 doh_bootstrap_dns 解析（见文件顶部）。
  overseas:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
    - "9.9.9.9:53"
    - "https://cloudflare-dns.com/dns-query"
    - "https://dns.google/dns-query"
    - "https://dns.quad9.net/dns-query"

# 缓存配置。基础响应缓存和响应结果缓存互相独立。
cache:
  # 基础响应缓存：负责客户端 DNS 响应缓存，内存加速 + JSON 文件持久化。
  response:
    # 是否启用基础响应缓存。
    enabled: true
    # 基础缓存持久化文件；文件内容为人可读 JSON。
    file_path: "./cache/response_cache.json"
    # 内存缓存最大条目数，超过后删除最久未访问的条目（LRU）。
    max_entries: 50000
    # 乐观缓存 TTL：缓存过期后仍立即返回，响应给客户端时统一改成该 TTL，并在后台刷新。
    stale_ttl: 3s
    # NXDOMAIN 可写入基础缓存，此处控制 NXDOMAIN 缓存时长。
    nxdomain_ttl: 30s

  # 响应结果缓存：只记录海外类有效 A 响应，用于默认路径中校对本地结果。
  response_result:
    # 是否启用响应结果缓存。
    enabled: true
    # 响应结果缓存持久化文件；记录 IP 集合、响应次数、IP 计数等统计信息。
    file_path: "./cache/response_result_cache.json"
    # 按 key 限制最大条目数，超过后删除最久未访问的条目（LRU）。
    max_entries: 50000
    # 单个 IP 超过多少天未再次出现则从该 key 的 IP 集合中删除。
    ip_idle_days: 30

# 分流规则配置。
routing:
  # 强制本地类解析的域名列表，优先级高于 local_domains。
  # 支持 apex + 子域；支持 "*.example.com" 严格子域。
  local_only: []

  # 所在国域名列表配置。命中的域名只使用本地类上游。
  local_domains:
    # 域名列表下载地址；启动时文件不存在会立即下载，之后按 update_interval_hours 定时更新。
    source_url: "https://raw.githubusercontent.com/wuchang1123/cn-dns-conf/refs/heads/main/out/dnsmasq-china.conf"
    # 本地保存路径；下载成功后热加载。
    file_path: "./data/china_domains.txt"
    # 更新间隔，单位小时。下载失败时保留旧文件和旧内存规则。
    update_interval_hours: 24

# 日志配置。
log:
  # 日志等级：debug, info, warn, error, fatal。
  level: "info"
  # 基础日志目录，主日志文件为 dns-lo-first.log。
  dir: "./logs"
  # 性能日志文件，记录客户端查询耗时和上游分段耗时。
  query_file: "./logs/query.log"
  # 日志保留时间，单位小时。程序运行中定时清理，启动时不立即清理。
  cleanup_hours: 48
